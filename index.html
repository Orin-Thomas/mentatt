<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Speed Reader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .input-section {
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-upload {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-upload input[type="file"] {
            flex: 1;
        }

        .rsvp-display {
            background: #f8f9fa;
            border: 3px solid #667eea;
            border-radius: 15px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .word-container {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            text-align: center;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .word-container .focus-letter {
            color: #e74c3c;
            font-weight: 900;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 5px;
            background: #667eea;
            width: 0%;
            transition: width 0.1s linear;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9fa;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .speed-control label {
            font-weight: 600;
            color: #667eea;
        }

        .speed-control input[type="range"] {
            width: 150px;
        }

        .speed-value {
            font-weight: bold;
            color: #333;
            min-width: 80px;
        }

        .stats {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 20px;
        }

        .info-text {
            text-align: center;
            color: #95a5a6;
            font-size: 14px;
            margin-top: 10px;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .word-container {
                font-size: 36px;
            }

            .controls {
                flex-direction: column;
            }

            .speed-control {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 RSVP Speed Reader</h1>

        <div class="input-section">
            <textarea id="textInput" placeholder="Paste your text here or upload a file below..."></textarea>
            <div class="file-upload">
                <input type="file" id="fileInput" accept=".txt">
                <button class="btn-success" onclick="loadText()">Load Text</button>
            </div>
        </div>

        <div class="rsvp-display">
            <div class="word-container" id="wordDisplay">Ready</div>
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="playPauseBtn" onclick="togglePlayPause()">▶ Start</button>
            <button class="btn-secondary" onclick="reset()">↻ Reset</button>

            <div class="speed-control">
                <label for="speedSlider">Speed:</label>
                <input type="range" id="speedSlider" min="100" max="1000" value="300" step="50" oninput="updateSpeed()">
                <span class="speed-value" id="speedValue">300 WPM</span>
            </div>
        </div>

        <div class="stats" id="stats">
            Words: 0 | Position: 0
        </div>

        <div class="info-text">
            💡 Tip: Focus on the red letter in the center of each word for optimal reading speed
        </div>
    </div>

    <script>
        let words = [];
        let currentIndex = 0;
        let isPlaying = false;
        let intervalId = null;
        let wpm = 300;

        const textInput = document.getElementById('textInput');
        const fileInput = document.getElementById('fileInput');
        const wordDisplay = document.getElementById('wordDisplay');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const progressBar = document.getElementById('progressBar');
        const stats = document.getElementById('stats');

        function loadText() {
            const text = textInput.value.trim();
            if (text) {
                words = text.split(/\s+/).filter(word => word.length > 0);
                currentIndex = 0;
                updateStats();
                wordDisplay.innerHTML = 'Ready';
                progressBar.style.width = '0%';

                if (words.length > 0) {
                    alert(`Text loaded! ${words.length} words ready to read.`);
                }
            } else {
                alert('Please enter some text first!');
            }
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    textInput.value = event.target.result;
                    loadText();
                };
                reader.readAsText(file);
            }
        });

        function formatWord(word) {
            // Find the optimal recognition point (ORP) - typically 1/3 into the word
            const orpIndex = Math.floor(word.length / 3);

            if (word.length === 0) return '';

            let formatted = '';
            for (let i = 0; i < word.length; i++) {
                if (i === orpIndex) {
                    formatted += `<span class="focus-letter">${word[i]}</span>`;
                } else {
                    formatted += word[i];
                }
            }
            return formatted;
        }

        function displayWord() {
            if (currentIndex < words.length) {
                const word = words[currentIndex];
                wordDisplay.innerHTML = formatWord(word);

                // Update progress
                const progress = ((currentIndex + 1) / words.length) * 100;
                progressBar.style.width = progress + '%';

                updateStats();
                currentIndex++;
            } else {
                // Finished reading
                stop();
                wordDisplay.innerHTML = '✓ Complete!';
                progressBar.style.width = '100%';
            }
        }

        function togglePlayPause() {
            if (words.length === 0) {
                alert('Please load some text first!');
                return;
            }

            if (isPlaying) {
                pause();
            } else {
                play();
            }
        }

        function play() {
            if (currentIndex >= words.length) {
                currentIndex = 0;
            }

            isPlaying = true;
            playPauseBtn.innerHTML = '⏸ Pause';
            playPauseBtn.className = 'btn-secondary';

            const delay = 60000 / wpm; // Convert WPM to milliseconds per word
            intervalId = setInterval(displayWord, delay);
            displayWord(); // Display first word immediately
        }

        function pause() {
            isPlaying = false;
            playPauseBtn.innerHTML = '▶ Resume';
            playPauseBtn.className = 'btn-primary';

            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
        }

        function stop() {
            isPlaying = false;
            playPauseBtn.innerHTML = '▶ Start';
            playPauseBtn.className = 'btn-primary';

            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
        }

        function reset() {
            stop();
            currentIndex = 0;
            wordDisplay.innerHTML = 'Ready';
            progressBar.style.width = '0%';
            updateStats();
        }

        function updateSpeed() {
            wpm = parseInt(speedSlider.value);
            speedValue.textContent = wpm + ' WPM';

            // If currently playing, restart with new speed
            if (isPlaying) {
                pause();
                play();
            }
        }

        function updateStats() {
            stats.textContent = `Words: ${words.length} | Position: ${currentIndex} of ${words.length}`;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayPause();
            } else if (e.code === 'Escape') {
                reset();
            }
        });

        // Initialize
        updateStats();
    </script>
</body>
</html>
